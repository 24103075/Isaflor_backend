spring.application.name=isaflor

# Configuracion del servidor para Render
server.port=${PORT:8080}
server.address=0.0.0.0

# Conexion a Neon PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Configuracion de conexiones
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Monitoreo del estado del backend
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Configuracion CORS para Actuator
management.endpoints.web.cors.allowed-origins=http://localhost:5173
management.endpoints.web.cors.allowed-methods=GET,OPTIONS

#Activar perfil local
spring.profiles.active=local