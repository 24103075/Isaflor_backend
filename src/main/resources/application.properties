
spring.application.name=isaflor

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Servidor
server.port=${PORT:8080}
server.address=0.0.0.0

# Conexion Neon PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ImgBB
imgbb.api.url=${IMGBB_API_URL}
imgbb.api.key=${IMGBB_API_KEY}

# Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Conexiones
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Monitoreo
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# CORS Actuator
management.endpoints.web.cors.allowed-origins=http://localhost:5173
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
